<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;display=swap");
      .font { font-family: "Space Grotesk", system-ui, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0c09"/>
      <stop offset="100%" stop-color="#1b1a13"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#f5a800"/>
    </pattern>
    <linearGradient id="dotMask" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <mask id="dotsMask" maskUnits="userSpaceOnUse">
      <rect width="1200" height="630" fill="url(#dotMask)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" mask="url(#dotsMask)">
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <text class="font" x="80" y="138" font-size="56" font-weight="700" letter-spacing="4" textLength="80" lengthAdjust="spacingAndGlyphs" fill="#f5a800">YD</text>
  <rect x="80" y="156" width="80" height="3" fill="#f5a800"/>

  <text class="font" x="80" y="305" font-size="26" font-weight="600" letter-spacing="6" fill="#f5a800">SOFTWARE &amp; WEB DEVELOPER</text>

  <text class="font" x="80" y="430" font-size="128" font-weight="700" letter-spacing="-4">
    <tspan fill="#f5a800">Y</tspan><tspan fill="#e8e4dc">oussef </tspan><tspan fill="#f5a800">D</tspan><tspan fill="#e8e4dc">awod.</tspan>
  </text>

  <text class="font" x="80" y="505" font-size="28" font-weight="400" fill="#8a8474">Ich baue Webl&#246;sungen, die nicht nur funktionieren — sondern bleiben.</text>
</svg>